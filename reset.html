<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><meta name="robots" content="noindex"><title>パスワードの再設定｜訪城記</title><link rel="stylesheet" href="app.css?v=2.0.2-release"><script defer src="sync-config.js?v=2.0.2-release"></script><script defer src="reset.js?v=2.0.2-release"></script></head>
<body><main style="max-width:620px;margin:40px auto;padding:20px"><div class="card stack"><div class="eyebrow">CASTLE JOURNAL</div><h1>パスワードの再設定</h1><p>訪城記のログイン用パスワードを変更します。訪問記録・ドライブプランはそのまま残ります。</p><p id="resetNotice" class="notice" role="status" aria-live="polite">登録済みのメールアドレスに再設定用のメールを送ります。</p>
<form id="requestForm" class="stack"><label>訪城記に登録したメールアドレス<input id="resetEmail" type="email" autocomplete="username" required></label><button id="requestButton" class="primary" type="submit">パスワード再設定メールを送る</button><small>Gmailの送信用アドレスではなく、訪城記へのログインに使うアドレスを入力してください。</small></form>
<form id="passwordForm" class="stack" hidden><p id="resetAccount"></p><label>新しいパスワード（8文字以上）<input id="newPassword" type="password" autocomplete="new-password" minlength="8" required></label><label>新しいパスワード（もう一度）<input id="repeatPassword" type="password" autocomplete="new-password" minlength="8" required></label><button id="savePassword" class="primary" type="submit">新しいパスワードを保存</button></form>
<a href="./?settings=1">訪城記の「保存・同期」へ戻る</a><small>Gmailのパスワードや、メール送信用のアプリパスワードは変更しません。</small></div></main></body></html>
